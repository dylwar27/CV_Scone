<script>
(function () {
  var bar = document.querySelector('[data-lensbar]');
  if (!bar) return;
  var buttons = bar.querySelectorAll('button[data-lens]');
  var panels  = document.querySelectorAll('.lens-panel[data-lens]');

  function show(lens, push) {
    var found = false;
    for (var i = 0; i < panels.length; i++) {
      var on = panels[i].getAttribute('data-lens') === lens;
      panels[i].classList.toggle('is-active', on);
      if (on) found = true;
    }
    if (!found) return false;
    for (var j = 0; j < buttons.length; j++) {
      var active = buttons[j].getAttribute('data-lens') === lens;
      buttons[j].setAttribute('aria-pressed', active ? 'true' : 'false');
      buttons[j].classList.toggle('is-active', active);
    }
    if (push && history.replaceState) {
      history.replaceState(null, '', lens === 'start' ? location.pathname : '#view-' + lens);
    }
    return true;
  }

  for (var k = 0; k < buttons.length; k++) {
    buttons[k].addEventListener('click', function () {
      show(this.getAttribute('data-lens'), true);
    });
  }

  // Deep link: /#view-clinical opens straight into that lens.
  var m = location.hash.match(/^#view-([a-z]+)$/);
  if (!m || !show(m[1], false)) show('start', false);
})();
</script>
