# Site settings
title: "Dylan Ward"
# jekyll-seo-tag renders the home page <title> as "title | tagline" when a tagline
# exists, and falls back to the whole description when it does not — which produced a
# paragraph-length browser tab. Keep this short (2026-09-01).
tagline: "Behavioral health, program management, counseling"
description: "Counselor in training and digital project manager in San Francisco. Two years running intake at a dual-diagnosis residential program, where I rebuilt the referral pipeline, the utilization reporting, and the Epic templates the program ran on. Before that, five years of agency project management in New York. MHRS-credentialed, NPI-registered, PMP."
author: "Dylan Ward"
url: "https://dylanward.work"
baseurl: ""
lang: en

# Contact. The site shows the dylanward.work alias, NOT the personal Gmail in
# the source database — dyl@ forwards to it via Cloudflare Email Routing.
# The source database (database/data/profile.yml) still carries the Gmail, so
# the resume and cover letters are unaffected.
contact_email: "dyl@dylanward.work"
# The ONE outbound link on the site, in the footer. LinkedIn is the hop that
# carries anyone who wants more on to the portfolio.
linkedin_url: "https://www.linkedin.com/in/dylwar"

plugins:
  - jekyll-seo-tag

# Build settings
markdown: kramdown
exclude: ["README.md", "bin", "Gemfile", "Gemfile.lock", "claude-thoughts"]
sass:
  style: compressed
