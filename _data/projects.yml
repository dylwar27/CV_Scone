# ── Sound Design ──────────────────────────────────────────────────────────────

- id: project.worth-my-salt-2014
  title: "Worth My Salt"
  type: art
  start: 2014-01
  end: 2014-12
  collaborators: ["Jody Kuehner (Cherdonna)"]
  role: "Sound Designer"
  description: >
    Original sound score for Cherdonna's first solo work. Layered Swan Lake,
    noise recorded from distant stars, and 1990s television and film into a
    pastiche-driven show about self-worth. Sold out every night at Velocity Dance
    Center, Seattle; subsequently presented in Portland and New York.
  artifacts:
    - label: "Velocity Dance Center — Made in Seattle archive"
      url: "https://archive.velocitydancecenter.org/program/made-in-seattle/"
    - label: "SeattleDances review"
      url: "https://seattledances.com/2014/10/do-you-think-this-is-easy-for-me-asks-cherdonna/"
  tags: [sound-design, time-based-media, performance]
  audience: [art-grant, residency, creative]
  themes: [craft, design]
  status: active
- id: project.disagreeable-tale-2014
  title: "A Disagreeable Tale of Duplicity"
  type: art
  start: 2014-01
  end: 2014-12
  collaborators: ["Olivier Wevers", "Whim W'Him"]
  role: "Sound Designer"
  description: >
    Sound score based heavily on Prokofiev's Romeo et Juliette for Whim W'Him,
    premiering at the Intiman Theater, Seattle. Critically acclaimed; received
