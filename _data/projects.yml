- id: project.arctic-refuge-2019
  title: "The Arctic Refuge Experience: Step In, Step Up"
  type: art
  start: 2019-01
  end: 2019-12
  collaborators: ["Future Colossal", "DoSomething Strategic", "The Wilderness Society"]
  role: "Project Manager + Sound Design"
  description: >
    Immersive experience incorporating mirror effects, projection, Kinect sensor
