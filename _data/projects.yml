- id: project.cv-database
  title: "Curriculum Viatae — Structured CV Database & Agent Ingest Pipeline"
  type: software
  start: 2026-05
  end: ongoing
  role: "Designer and sole builder"
  description: >
    A structured YAML database of every role, accomplishment, project, and skill, with a
    closed tagging vocabulary that lets a résumé be reassembled for any audience. Includes
    a documented schema, an ingest contract that turns raw documents and spoken notes into
    draft entries, and a Jekyll site that renders the same database through switchable
    lenses.
  url: "https://dylanward.work"
  artifacts:
    - label: "Live CV site"
      url: "https://dylanward.work"
  tags: [ai-tooling, automation, data-analysis, process-improvement, programming]
  audience: [tech, product, general]
  themes: [0-to-1, tinkering, curiosity, craft]
  status: active
