- id: project.cv-database
  title: "Curriculum Viatae — Structured CV Database & Agent Ingest Pipeline"
  type: software
  start: 2026-05
  end: ongoing
  role: "Designer and sole builder"
  description: >
    A structured YAML database of every role, accomplishment, project, and skill,
    with a closed tagging vocabulary (audience, theme, tag) that lets an LLM
    reassemble a résumé for any given audience on demand. Includes a documented
    schema, an agent ingest contract that turns raw source documents and spoken
    brain-dumps into validated draft entries, and a Jekyll site that renders the
    same database through switchable lenses — clinical, digital PM, onsite PM,
    arts — each pulling a different slice of the same underlying facts.
  url: "https://dylwar27.github.io/CV_Scone/"
  artifacts:
    - label: "Live CV site"
      url: "https://dylwar27.github.io/CV_Scone/"
  tags: [ai-tooling, automation, data-analysis, process-improvement, programming]
  audience: [tech, product, general]
  themes: [0-to-1, tinkering, curiosity, craft]
  status: active
