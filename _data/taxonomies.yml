# Taxonomies — closed vocabulary the LLM is allowed to use.
# Keep this list ruthlessly short. If a tag here is used in <3 entries, prune it.
# When you find yourself wanting a tag that's not here, add it deliberately.
# Last updated: 2026-05-26 (ingest pass — added clinical, arts, and PM vocabulary)

