  - id: summary.linkedin-about
    audience: [linkedin, general]
    length: long
    status: active
    source: >
      Co-written with Dyl 2026-08-31 (evening), plain-professional register per the voice
      rule (no aphorisms, minimal em-dashes, one number per paragraph). Renders to
      render/linkedin/LINKEDIN.md §2. The site link is deliberately NOT in the About body —
      LinkedIn does not hyperlink About text. dylanward.work went live 2026-08-31 and lives
      in Featured (§7) instead, where it is clickable. The "What I'm looking for" paragraph is the audience-swap slot.
    text: >
      I'm a counselor in training and a digital project manager. Recently I ran intake
      at a dual-diagnosis residential program in San Francisco: 32 to 48 assessments a
      month for residential transfer from jails and hospitals. I also rebuilt the
      systems around the job, digitizing the referral pipeline, automating the
      utilization reporting, and consolidating the Epic templates the program ran on.
      Bed utilization went from averaging 62% to over 78% while I had it.


      A lot of that work was documentation compliance. Medi-Cal's rules are written
      for auditors, so I turned them into criteria and templates clinicians could
      actually apply, then audited against them and fixed what failed.


      Outside of work I lead harm reduction for community events, run with the same
      attention to protocol and follow-through.


      Before clinical work I spent five years as an agency project manager in New
      York. I co-founded a PMO, led the agile transition that consolidated twelve
      brand teams at Anheuser-Busch into a single operating unit, and built reporting
      and automation that gave teams real hours back each week, built trust with
      clients, and made us money.


      Credentials: MHRS, NPI-registered, PMP, Google Data Analytics Certificate,
      hands-on Epic and Netsmart Avatar. M.A. in Clinical Mental Health Counseling at
      Palo Alto University, finishing June 2027.


      I'm looking for work where clinical judgment and constructive supervision get
      built into systems: trust and safety, user well-being, quality and utilization
      review, or program design. San Francisco or remote.

