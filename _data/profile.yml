  - id: summary.bio-long
    audience: [bio, about-page]
    length: long
    status: draft
    text: >
      Dylan Ward is a practitioner, artist, and producer whose work moves between
      clinical mental health, creative production, and systems management. He began
      his professional life in queer outreach and harm reduction in Seattle, went on
      to produce and choreograph dance and theater works across the Pacific Northwest,
      then spent five years as a project manager in New York advertising agencies
      before returning to the human services work that started it all.

      He is currently completing an M.A. in Clinical Mental Health Counseling at
      Palo Alto University while working as an intake specialist at PRC Baker Places
      in San Francisco, a dual-diagnosis residential facility. He holds PMP and MHRS
      credentials and has worked with Epic and Avatar electronic health record systems.

      His creative work, made under the name Sleep Nod, spans choreography, sound
      design, video direction, and writing. He has collaborated with Alice Gosti,
      Lars Jan, zoe|juniper, Petra Zanki, Dayna Hanson, and Jody Kuehner (Cherdonna),
      and produced immersive experiences for Ernst & Young and The Wilderness Society.
      He is currently serializing a novel and grief essay arc on Substack.

      He lives in San Francisco.
