  themes: [research-to-decision, service]
  metrics: ["3–5 outside providers reconciled per client", "assessment turnaround ~7 days → 24–72 hours"]
  star:
    situation: "Intake assessments stalled because client histories were scattered across multiple health systems and arrived incomplete."
    task: "Complete AO-07 assessments fast enough that beds did not sit empty waiting on paperwork."
    action: "Pulled records directly from Epic, then worked 3–5 outside providers per client by Epic message, phone, and email; reconstructed missing social history from partial records."
    result: "Late assessments dropped sharply and turnaround fell from ~7 days to 24–72 hours, feeding the bed-utilization gain."
