- id: bullet.baaahs-hr-program-design
  role_id: role.baaahs-harm-reduction
  text: >
    Designed the harm reduction program for BAAAHS, a large-scale queer arts
    community at festivals of ~200–800 attendees, including protocols for risk
    recognition, supportive engagement, and referral-to-care.
  tags: [harm-reduction, program-design, event-production, outreach]
  skills: [skill.harm-reduction, skill.program-design]
  audience: [clinical, nonprofit]
  themes: [harm-reduction, community-building, 0-to-1]
  metrics: ["events ~200–800 attendees"]
  verified: true
  status: active
- id: bullet.baaahs-hr-escalation-protocol
  role_id: role.baaahs-harm-reduction
  text: >
    Wrote the escalation protocol the harm reduction team worked from. Five tiers, from
    disoriented-but-well through medical need to a 911 call, each with a defined response
    and a defined handoff. Standing rules across every tier: work in pairs, stay on radio
    with event and venue leads, and check back on anyone who was handed off.
  tags: [harm-reduction, crisis-response, program-design, process-improvement, policy-design]
  skills: [skill.harm-reduction, skill.program-design, skill.crisis-communication]
  audience: [clinical, nonprofit, tech, product]
  themes: [harm-reduction, research-to-decision, 0-to-1]
  metrics: ["5 escalation tiers", "events ~200-800 attendees"]
  verified: true
  status: active
- id: bullet.baaahs-hr-volunteer-training
  role_id: role.baaahs-harm-reduction
  text: >
    Trained 3 volunteer "rangers" at BAAAHS in risk recognition, supportive
    engagement, and referral-to-care protocols for large-scale queer arts events.
  tags: [harm-reduction, outreach, leadership, queer-competency]
  skills: [skill.harm-reduction, skill.group-facilitation]
  audience: [clinical, nonprofit, art-grant]
  themes: [harm-reduction, people-development]
  metrics: ["3 rangers trained"]
  verified: true
  status: active
- id: bullet.baaahs-hr-scope-boundary
  role_id: role.baaahs-harm-reduction
  text: >
    Narrowed what frontline volunteers were expected to carry. Before the protocol,
    rangers felt obligated to talk people through crises themselves. The written tiers
    gave them a response for each situation and a person to route it to, so their job
    was to stabilize and hand off rather than to fix. One said it was much easier than
    they had thought.
  tags: [harm-reduction, program-design, leadership, people-development, policy-design]
  skills: [skill.harm-reduction, skill.program-design, skill.people-development]
  audience: [clinical, nonprofit, tech, product, leadership]
  themes: [harm-reduction, people-development, service]
  metrics: ["3 rangers trained"]
  verified: true
  status: active
- id: bullet.baaahs-hr-frontline-ranger
  role_id: role.baaahs-harm-reduction
  text: >
    Serve as a frontline harm-reduction ranger at festivals — sitting with people
    in altered states, providing psychological first aid and de-escalation,
    administering naloxone, and executing referral protocols.
  tags: [harm-reduction, crisis-response, substance-use, peer-support]
  skills: [skill.harm-reduction, skill.crisis-communication, skill.overdose-response]
  audience: [clinical, nonprofit, art-grant]
  themes: [harm-reduction, service]
  metrics: ["led the program at 1 festival; volunteered on 3 other festivals' teams", "assisted in psychiatric and medical crises"]
  verified: true
  status: active
