- id: bullet.prc-capacity-forecast
  role_id: role.prc-baker-intake
  text: >
    Rebuilt the bed census as a forecast instead of a daily count. Bucketed admitted
    clients at 45, 90, and 120 days of stay, flagged stays past 90 as extensions that
    would not free on the standard cycle, and joined the census on medical record number
    to the clearance and authorization records so each referral showed what documentation
    was still missing. Refreshed daily and read by the CEO, clinical leadership, and the
    San Francisco Department of Public Health.
  tags: [health-it, data-analysis, process-improvement, stakeholder-management, intake-assessment]
  skills: [skill.data-analysis, skill.microsoft-365, skill.process-improvement, skill.clinical-data-translation]
  audience: [clinical, exec, leadership, nonprofit, civic, tech]
  themes: [research-to-decision, 0-to-1]
  metrics: ["4 houses", "length-of-stay buckets at 45 / 90 / 120 days", "daily refresh"]
  star:
    situation: "Bed capacity was a point-in-time count. During the city's residential treatment push SF DPH was asking what capacity existed, and the program could only estimate."
    task: "Make capacity answerable months out, and make it clear which referrals were actually admissible."
    action: "Built length-of-stay logic against admitted referrals in Microsoft Access, set thresholds at 45 / 90 / 120 days, flagged over-90 stays as extensions held outside the standard cycle, and joined on medical record number to the tables holding TB clearance, physician clearance, and Medi-Cal and other insurance authorization."
    result: "Leadership and the San Francisco Department of Public Health worked off a daily forecast rather than a snapshot. When referral volume ran past forecast capacity, the program routed the overflow to other providers instead of queueing it."
  source: "Voice memo 2026-08-31; verified by Dyl 2026-09-01. Tool was Microsoft Access (Query Design view). Join key was the MRN — the medical record number tracked in the SF DPH system. Authorship stated plainly: specified the logic and composed it through the Access query builder, validated output by reading the generated query back against intent; did not hand-author SQL text."
  verified: true
  status: active
