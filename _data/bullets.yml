- id: bullet.prc-bed-utilization
  role_id: role.prc-baker-intake
  text: >
    Improved average bed utilization from ~62% to 78%+ (rolling 3 months) by
    digitizing internal intake and referral processes.
  tags: [intake-assessment, process-improvement, data-analysis]
  skills: [skill.clinical-intake, skill.process-improvement, skill.clinical-documentation]
  audience: [clinical, nonprofit, exec]
  themes: [research-to-decision, scaling]
  metrics: [utilization-rate]
  verified: true
  status: active
- id: bullet.prc-records-research
  role_id: role.prc-baker-intake
  text: >
    Completed AOA-07 intake assessments through multi-provider records research: Epic
    first, then three to five outside providers per client by message, phone, and email,
    rebuilding social histories from fragmentary records. Assessment turnaround fell from
    about seven days to 24–72 hours.
  tags: [health-it, intake-assessment, case-management, clinical-documentation, process-improvement]
  skills: [skill.medical-records-research, skill.clinical-assessments, skill.clinical-intake, skill.epic-superuser]
  audience: [clinical, nonprofit, academic]
  themes: [research-to-decision, service]
  metrics: ["3–5 outside providers reconciled per client", "assessment turnaround ~7 days → 24–72 hours"]
  verified: true
  status: active
- id: bullet.prc-digital-workflow
  role_id: role.prc-baker-intake
  text: >
    Maintained and extended the agency's SQL referral database and built the digital
    intake workflow around it: online forms, Teams routing, email, and website updates
    across four houses, partner jails, and SF DPH. It replaced a fax-based manual process.
  variants:
    - audience: exec
      text: >
        Re-engineered a fax-based intake pipeline into a digital workflow on top of
        an SQL database, cutting client placement time 25–50% and driving missed
        referrals to near zero across four sites.
    - audience: clinical
      text: >
        Digitized the intake-to-placement workflow across four residential houses,
        jails, and SF DPH, shortening time-to-placement and ensuring no referral was
        lost between the referring system and our level of care.
  tags: [process-improvement, data-analysis, clinical-documentation, stakeholder-management]
  skills: [skill.process-improvement, skill.data-analysis, skill.microsoft-365]
  audience: [clinical, nonprofit, exec, tech]
  themes: [0-to-1, research-to-decision, scaling]
  metrics:
    - "client placement 25–50% faster"
    - "referral-receipt confirmation: a few business days → a few hours"
    - "missed/dropped referrals: a few per month (fax) → near zero, locatable in minutes not days"
  verified: true
  status: active
